<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de APIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Teste de APIs</h1>
    <button onclick="BuscarImagem()">Chamar a API</button>
    <img id="foto" alt="Foto de um cachorro">

    <script>
        async function BuscarImagem(){
            const resposta = await fetch("https://dog.ceo/api/breeds/image/random");
            const dados = await resposta.json();
            document.getElementById("foto").src = dados.message;
        }
    </script>
</body>
</html>
